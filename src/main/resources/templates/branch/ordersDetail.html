<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/branchLayout::branchLayout(~{this::header},~{this::body})}">
    <div th:fragment="header">
        <h2>발주 상세</h2>
        <p>선택한 발주의 상품, 수량, 가격 정보를 확인합니다</p>
    </div>
    <div th:fragment="body">
        <div>
            <div>
                <h3>발주 상세</h3><hr><br>
                <p>발주번호: <span th:text="${ordersHeaderDto.order_id}"></span></p>
                <p>발주일: <span th:text="${#dates.format(ordersHeaderDto.order_date,'yyyy-MM-dd')}"></span></p><br>
            </div>
            <div>
                <h3>발주 상품</h3><hr><br>
                <table>
                    <thead>
                        <tr>
                            <th>카테고리</th><th>상품명</th><th>수량</th><th>가격</th><th>총금액</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detail : ${list}">
                            <td th:text="${detail.category_name}"></td>
                            <td th:text="${detail.product_name}"></td>
                            <td th:text="${detail.order_qty}"></td>
                            <td th:text="${detail.hq_supply_price}"></td>
                            <td th:text="${detail.total_price}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</html>
